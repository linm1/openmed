<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenMed Redaction Tester</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        line-height: 1.6;
      }

      body[data-theme="light"] {
        background: #fafafa;
        color: #333;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      body[data-theme="light"] header {
        border-bottom-color: rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
      }

      .theme-toggle {
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: background 0.2s;
      }

      .theme-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      body[data-theme="light"] .theme-toggle:hover {
        background: rgba(0, 0, 0, 0.1);
      }

      .error-banner {
        display: none;
        background: #dc2626;
        color: white;
        padding: 12px 16px;
        border-radius: 4px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .error-banner.show {
        display: block;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
      }

      @media (max-width: 768px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 20px;
      }

      body[data-theme="light"] .panel {
        background: rgba(0, 0, 0, 0.02);
        border-color: rgba(0, 0, 0, 0.1);
      }

      .panel h2 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.7;
      }

      textarea {
        width: 100%;
        min-height: 200px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        padding: 12px;
        color: inherit;
        font-family: monospace;
        font-size: 13px;
        resize: vertical;
      }

      body[data-theme="light"] textarea {
        background: rgba(0, 0, 0, 0.02);
        border-color: rgba(0, 0, 0, 0.1);
      }

      textarea:focus {
        outline: none;
        border-color: #3b82f6;
      }

      .output-box {
        min-height: 200px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        padding: 12px;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.6;
        word-break: break-word;
      }

      body[data-theme="light"] .output-box {
        background: rgba(0, 0, 0, 0.02);
        border-color: rgba(0, 0, 0, 0.1);
      }

      .redaction {
        background: rgba(239, 68, 68, 0.3);
        padding: 2px 4px;
        border-radius: 2px;
        cursor: help;
        border-bottom: 2px solid #ef4444;
      }

      .redaction:hover {
        background: rgba(239, 68, 68, 0.5);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
        opacity: 0.7;
      }

      select,
      input[type="range"],
      input[type="checkbox"] {
        padding: 8px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        color: inherit;
        font: inherit;
      }

      body[data-theme="light"] select,
      body[data-theme="light"] input[type="range"],
      body[data-theme="light"] input[type="checkbox"] {
        background: rgba(0, 0, 0, 0.02);
        border-color: rgba(0, 0, 0, 0.1);
      }

      select:focus,
      input[type="range"]:focus {
        outline: none;
        border-color: #3b82f6;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .checkbox-group input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      .range-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }

      .range-value {
        font-weight: 600;
        color: #3b82f6;
      }

      .run-button {
        grid-column: 1 / -1;
        padding: 12px 20px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, opacity 0.2s;
      }

      .run-button:hover:not(:disabled) {
        background: #2563eb;
      }

      .run-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .entity-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 12px;
      }

      .entity-table th {
        text-align: left;
        padding: 8px;
        background: rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 10px;
      }

      body[data-theme="light"] .entity-table th {
        background: rgba(0, 0, 0, 0.05);
        border-bottom-color: rgba(0, 0, 0, 0.1);
      }

      .entity-table td {
        padding: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      body[data-theme="light"] .entity-table td {
        border-bottom-color: rgba(0, 0, 0, 0.05);
      }

      .entity-label {
        background: rgba(59, 130, 246, 0.2);
        padding: 2px 6px;
        border-radius: 2px;
        font-weight: 600;
      }

      .stats {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 12px;
        opacity: 0.7;
      }

      body[data-theme="light"] .stats {
        border-top-color: rgba(0, 0, 0, 0.1);
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }

      .stat-label {
        opacity: 0.7;
      }

      .stat-value {
        font-weight: 600;
        font-family: monospace;
      }
    </style>
  </head>
  <body data-theme="dark">
    <div class="container">
      <header>
        <h1>OpenMed Redaction Tester</h1>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </header>

      <div id="errorBanner" class="error-banner"></div>

      <div class="layout">
        <div class="panel">
          <h2>Input</h2>
          <textarea id="inputText" placeholder="Paste clinical text here...&#10;&#10;Example: Patient John Smith, DOB 03/12/1985, SSN 123-45-6789 called from 555-0192..."></textarea>

          <div class="controls">
            <div class="control-group">
              <label for="method">Redaction Method</label>
              <select id="method">
                <option value="mask">Mask ([ENTITY])</option>
                <option value="remove">Remove</option>
                <option value="replace">Replace (synthetic)</option>
                <option value="hash">Hash</option>
                <option value="shift_dates">Shift Dates</option>
              </select>
            </div>

            <div class="control-group">
              <label for="language">Language</label>
              <select id="language">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="es">Español</option>
                <option value="nl">Nederlands</option>
                <option value="hi">हिन्दी</option>
                <option value="te">తెలుగు</option>
              </select>
            </div>

            <div class="control-group">
              <div class="range-label">
                <label for="threshold">Confidence Threshold</label>
                <span class="range-value" id="thresholdValue">0.5</span>
              </div>
              <input type="range" id="threshold" min="0" max="1" step="0.05" value="0.5" />
            </div>

            <div class="control-group">
              <div class="checkbox-group">
                <input type="checkbox" id="keepMapping" />
                <label for="keepMapping" style="margin-bottom: 0">Keep Mapping (re-identify)</label>
              </div>
            </div>

            <button class="run-button" id="runButton">Run Redaction</button>
          </div>
        </div>

        <div class="panel">
          <h2>Output</h2>
          <div class="output-box" id="outputText"></div>
          <table class="entity-table" id="entityTable" style="display: none">
            <thead>
              <tr>
                <th>Entity Type</th>
                <th>Text</th>
                <th>Confidence</th>
              </tr>
            </thead>
            <tbody id="entityTableBody"></tbody>
          </table>
          <div class="stats" id="stats"></div>
        </div>
      </div>
    </div>

    <script>
      const state = {
        busy: false,
        lastResult: null,
        theme: getSavedTheme(),
      };

      const els = {
        themeToggle: document.querySelector("#themeToggle"),
        inputText: document.querySelector("#inputText"),
        outputText: document.querySelector("#outputText"),
        method: document.querySelector("#method"),
        threshold: document.querySelector("#threshold"),
        thresholdValue: document.querySelector("#thresholdValue"),
        language: document.querySelector("#language"),
        keepMapping: document.querySelector("#keepMapping"),
        runButton: document.querySelector("#runButton"),
        entityTable: document.querySelector("#entityTable"),
        entityTableBody: document.querySelector("#entityTableBody"),
        errorBanner: document.querySelector("#errorBanner"),
        stats: document.querySelector("#stats"),
      };

      // Theme management
      function getSavedTheme() {
        try {
          const saved = localStorage.getItem("openmed-tester-theme");
          return saved === "light" || saved === "dark" ? saved : "dark";
        } catch {
          return "dark";
        }
      }

      function setTheme(theme) {
        state.theme = theme;
        document.documentElement.dataset.theme = theme;
        try {
          localStorage.setItem("openmed-tester-theme", theme);
        } catch {}
      }

      function toggleTheme() {
        setTheme(state.theme === "dark" ? "light" : "dark");
      }

      // Utilities
      const escapeHtml = (str) =>
        str
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");

      function showError(message) {
        els.errorBanner.textContent = message;
        els.errorBanner.classList.add("show");
        setTimeout(() => els.errorBanner.classList.remove("show"), 5000);
      }

      // Entity rendering with highlights
      function renderEntitiesHighlight(text, entities = []) {
        if (!entities || entities.length === 0) {
          return escapeHtml(text);
        }

        const sorted = [...entities].sort((a, b) => a.start - b.start || b.end - a.end);
        let html = "";
        let cursor = 0;

        for (const entity of sorted) {
          if (entity.start < cursor || entity.end <= entity.start) continue;
          html += escapeHtml(text.slice(cursor, entity.start));
          const original = text.slice(entity.start, entity.end);
          const label = entity.label || "unknown";
          const confidence = entity.confidence || entity.score || 0;
          html += `<span class="redaction" title="${escapeHtml(label)} (${(confidence * 100).toFixed(0)}%)">${escapeHtml(original)}</span>`;
          cursor = entity.end;
        }

        html += escapeHtml(text.slice(cursor));
        return html;
      }

      // Run redaction
      async function runRedaction() {
        if (state.busy) return;

        const text = els.inputText.value.trim();
        if (!text) {
          showError("Please enter some text first");
          return;
        }

        state.busy = true;
        els.runButton.disabled = true;
        els.errorBanner.classList.remove("show");

        try {
          // Run both extract and deidentify in parallel
          const [extractRes, deidentifyRes] = await Promise.all([
            fetch("http://localhost:1248/pii/extract", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                text,
                confidence_threshold: parseFloat(els.threshold.value),
                lang: els.language.value,
                use_smart_merging: true,
              }),
            }),
            fetch("http://localhost:1248/pii/deidentify", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                text,
                method: els.method.value,
                confidence_threshold: parseFloat(els.threshold.value),
                lang: els.language.value,
                keep_mapping: els.keepMapping.checked,
                use_smart_merging: true,
              }),
            }),
          ]);

          if (!extractRes.ok || !deidentifyRes.ok) {
            throw new Error(`HTTP ${extractRes.status || deidentifyRes.status}`);
          }

          const extractData = await extractRes.json();
          const deidentifyData = await deidentifyRes.json();

          state.lastResult = { extractData, deidentifyData };

          // Render output
          const deidentText = deidentifyData.deidentified_text || text;
          const entities = extractData.entities || [];

          els.outputText.innerHTML = renderEntitiesHighlight(deidentText, entities);

          // Render entity table
          if (entities.length > 0) {
            els.entityTableBody.innerHTML = entities
              .map(
                (e) =>
                  `<tr>
                    <td><span class="entity-label">${escapeHtml(e.label || "unknown")}</span></td>
                    <td><code>${escapeHtml(e.text || text.slice(e.start, e.end))}</code></td>
                    <td>${((e.confidence || e.score || 0) * 100).toFixed(0)}%</td>
                  </tr>`
              )
              .join("");
            els.entityTable.style.display = "table";
          } else {
            els.entityTable.style.display = "none";
          }

          // Show stats
          els.stats.innerHTML = `
            <div class="stat-row">
              <span class="stat-label">Detected Entities:</span>
              <span class="stat-value">${entities.length}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Input Length:</span>
              <span class="stat-value">${text.length} chars</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Output Length:</span>
              <span class="stat-value">${deidentText.length} chars</span>
            </div>
            ${
              els.keepMapping.checked && deidentifyData.mapping
                ? `<div class="stat-row">
                  <span class="stat-label">Mapping:</span>
                  <span class="stat-value">${Object.keys(deidentifyData.mapping).length} entries</span>
                </div>`
                : ""
            }
          `;

          // Show mapping if requested
          if (els.keepMapping.checked && deidentifyData.mapping) {
            const mappingHtml = `<details style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1)">
              <summary style="cursor: pointer; opacity: 0.7">Show Re-identification Mapping</summary>
              <pre style="margin-top: 8px; font-size: 11px; overflow-x: auto">${escapeHtml(JSON.stringify(deidentifyData.mapping, null, 2))}</pre>
            </details>`;
            els.stats.innerHTML += mappingHtml;
          }
        } catch (error) {
          console.error(error);
          showError(`Error: ${error.message} — is the service running at http://localhost:1248?`);
        } finally {
          state.busy = false;
          els.runButton.disabled = false;
        }
      }

      // Event listeners
      els.themeToggle.addEventListener("click", toggleTheme);
      els.threshold.addEventListener("input", (e) => {
        els.thresholdValue.textContent = parseFloat(e.target.value).toFixed(2);
      });
      els.runButton.addEventListener("click", runRedaction);

      // Auto-run on text change (debounced)
      let autoRunTimeout;
      els.inputText.addEventListener("input", () => {
        clearTimeout(autoRunTimeout);
        autoRunTimeout = setTimeout(() => {
          if (els.inputText.value.length > 10 && !state.busy) {
            runRedaction();
          }
        }, 1000);
      });

      // Keyboard shortcut
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          runRedaction();
        }
      });

      // Init theme
      setTheme(state.theme);

      // Populate sample text
      els.inputText.placeholder =
        "Paste clinical text here...\n\nExample: Patient John Smith, DOB 03/12/1985, SSN 123-45-6789 was admitted with fever. Contact: 555-0192 or john@example.com";
    </script>
  </body>
</html>
